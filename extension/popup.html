<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job Apply Agent</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 400px;
      min-height: 200px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      background: #0f1117;
      color: #e2e8f0;
    }

    #root { display: flex; flex-direction: column; min-height: 200px; }

    /* ── Header ────────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 12px 16px;
      background: #161b27;
      border-bottom: 1px solid #1e2535;
      font-weight: 600;
      font-size: 14px;
      color: #cbd5e1;
    }
    .logo { color: #6366f1; font-size: 16px; }

    /* ── Idle ──────────────────────────────────── */
    .idle-body {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 32px 24px;
    }
    .hint { color: #64748b; font-size: 12px; text-align: center; line-height: 1.5; }

    /* ── Extracting ────────────────────────────── */
    .spinner-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding: 40px 24px;
    }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid #1e2535;
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner-label { color: #64748b; font-size: 13px; }

    /* ── Meta ──────────────────────────────────── */
    .meta {
      padding: 12px 16px;
      border-bottom: 1px solid #1e2535;
    }
    .meta-company { font-weight: 600; color: #e2e8f0; font-size: 14px; }
    .meta-role { color: #94a3b8; font-size: 12px; margin-top: 2px; }

    /* ── Tabs ──────────────────────────────────── */
    .tabs {
      display: flex;
      border-bottom: 1px solid #1e2535;
    }
    .tab {
      flex: 1;
      padding: 8px 0;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      color: #64748b;
      font-size: 12px;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }
    .tab:hover { color: #cbd5e1; }
    .tab-active { color: #6366f1; border-bottom-color: #6366f1; }

    /* ── Content box ───────────────────────────── */
    .content-box {
      padding: 12px 16px;
      max-height: 260px;
      overflow-y: auto;
      font-family: "SF Mono", "Fira Code", monospace;
      font-size: 11px;
      line-height: 1.6;
      color: #cbd5e1;
      white-space: pre-wrap;
      word-break: break-word;
      scrollbar-width: thin;
      scrollbar-color: #1e2535 transparent;
    }

    /* ── Actions ───────────────────────────────── */
    .actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 12px 16px;
      border-top: 1px solid #1e2535;
    }

    /* ── Buttons ───────────────────────────────── */
    .btn-primary, .btn-secondary {
      width: 100%;
      padding: 9px 16px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s, background 0.15s;
    }
    .btn-primary {
      background: #6366f1;
      color: #fff;
    }
    .btn-primary:hover { background: #5254d4; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary {
      background: #1e2535;
      color: #94a3b8;
    }
    .btn-secondary:hover { background: #263048; }
    .btn-large { font-size: 14px; padding: 11px 24px; }

    /* ── Confirmed ─────────────────────────────── */
    .confirmed-body {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 28px 24px 16px;
      text-align: center;
    }
    .confirmed-icon {
      width: 44px; height: 44px;
      display: flex; align-items: center; justify-content: center;
      background: #14532d;
      color: #4ade80;
      font-size: 22px;
      border-radius: 50%;
      margin-bottom: 4px;
    }
    .confirmed-title { font-size: 15px; font-weight: 600; color: #e2e8f0; }
    .confirmed-detail { color: #94a3b8; font-size: 12px; }
    .confirmed-time { color: #64748b; font-size: 11px; }

    /* ── Setup ─────────────────────────────────── */
    .setup-body {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 14px 16px;
    }
    .setup-title { font-size: 14px; font-weight: 600; color: #e2e8f0; }
    .resume-input {
      width: 100%;
      height: 180px;
      padding: 10px 12px;
      background: #161b27;
      border: 1px solid #1e2535;
      border-radius: 6px;
      color: #cbd5e1;
      font-family: "SF Mono", "Fira Code", monospace;
      font-size: 11px;
      line-height: 1.6;
      resize: vertical;
    }
    .resume-input:focus { outline: none; border-color: #6366f1; }

    /* ── Ghost button ───────────────────────────── */
    .btn-ghost {
      background: none;
      border: none;
      color: #475569;
      font-size: 11px;
      cursor: pointer;
      padding: 4px 0;
    }
    .btn-ghost:hover { color: #64748b; }

    /* ── Error ─────────────────────────────────── */
    .error-body {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 24px;
    }
    .error-msg {
      color: #f87171;
      font-size: 12px;
      text-align: center;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="dist/popup.js"></script>
</body>
</html>
